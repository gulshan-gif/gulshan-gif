<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyWeB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">⭐ MyWeB</div>
      <ul class="nav-links">
        <li><a href=index.html>Home</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="hero" class="hero">
    <h1>Welcome to MyWeB</h1>
    <p>Shining your ideas into the digital space.</p>
    <button onclick="scrollToFeatures()">Explore Features</button>
  </section>

  <section id="features" class="features">
    <h2>Features</h2>
    <div class="feature-grid">
      <div class="feature-item">✨ Fast</div>
      <div class="feature-item">🎨 Stylish</div>
      <div class="feature-item">📱 Responsive</div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact Us</h2>
    <form onsubmit="handleSubmit(event)">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2025 MyWeB. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
